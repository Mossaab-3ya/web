<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Web Site</title>
    <style>
        body {
            font-family: Cambria, serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 800px;
            height: 400px;
            background-color: white;
            margin: 50px auto;
            padding: 20px;
            border: 2px solid black;
        }
        .black-text {
            font-size: 14px;
            color: black;
        }

        h1 {
            text-align: center;
        }

        .content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }

        .info {
            width: 50%;
            font-size: 18px;
        }

        .info p {
            margin: 10px 0;
        }
        .green {
            color: green;
            font-size: 16px;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image-box {
            width: 250px;
            height: 250px;
            border: 2px solid black;
        }

        .dev {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            color: red;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome my web site</h1>

        <div class="dev">Dev Web</div>

        <div class="content">
            <div class="info">
                <p><strong class="green">Full Name :</strong>
                   <span class="black-text">Mossaab Aya</span></p>
                <p><strong class="green">Age :</strong><span class="black-text">20</span> </p>
                <p><strong class="green">Class :</strong><span class="black-text">6</span> </p>
                <p><strong class="green">University :</strong><span class="black-text">Hamma Lakhdar ELouad</span> </p>
            </div>

            <div class="image-box">
                <img src="MOSSAAB.jpg" alt="My Photo">
            </div>
        </div>
    </div>

</body>
</html>
